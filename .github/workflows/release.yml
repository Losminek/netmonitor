# Sestavení a vydání NetMonitoru pro Windows, Linux a macOS (Intel i Apple Silicon).
# Spuštění:
#   a) push na main se zvýšenou verzí v src/netmonitor/__init__.py => release v<verze> se založí sám
#      (poznámky z CHANGELOG.md); pokud release té verze už existuje, nic se nevydává
#   b) vytvořením release / tagu "v*" na GitHubu
#   c) ručně: Actions → Build & Release → Run workflow → zadat existující tag (např. v1.0.1)
# Každý build nahraje své soubory PŘÍMO do release – nepoužívá Actions artefakty
# (ty mají u soukromých repozitářů omezenou kvótu úložiště; assety release se do ní nepočítají).
# Před buildem se na každé platformě spustí kompletní testy.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existujícího release, do kterého se nahrají soubory (např. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
      missing: ${{ steps.v.outputs.missing }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/netmonitor/__init__.py').read()).group(1))")
            TAG="v$VER"
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # release existuje – doplní se jen platformy, jejichž soubory v něm chybí (např. po selhání buildu)
              NAMES=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
              MISSING=""
              echo "$NAMES" | grep -q -- '-setup\.exe$' || MISSING="$MISSING windows-x64"
              echo "$NAMES" | grep -q -- 'linux-x86_64\.tar\.gz$' || MISSING="$MISSING linux-x86_64"
              echo "$NAMES" | grep -q -- 'macos-arm64\.dmg$' || MISSING="$MISSING macos-arm64"
              echo "$NAMES" | grep -q -- 'macos-x86_64\.dmg$' || MISSING="$MISSING macos-x86_64"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
              if [ -z "$MISSING" ]; then
                echo "Release $TAG už existuje a je kompletní – nic nevydávám."
                echo "build=false" >> "$GITHUB_OUTPUT"
              else
                echo "Release $TAG existuje, doplňuji:$MISSING"
                echo "build=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            python3 scripts/changelog_section.py "$VER" > notes.md
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "NetMonitor $VER" --notes-file notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
          echo "missing=windows-x64 linux-x86_64 macos-arm64 macos-x86_64" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04          # starší glibc => běží i na Debian 12 / Ubuntu 22.04+
            name: linux-x86_64
          - os: macos-latest          # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel        # Intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      # tato platforma se staví jen tehdy, když její soubory v release chybí
      DO_BUILD: ${{ contains(format(' {0} ', needs.prepare.outputs.missing), format(' {0} ', matrix.name)) }}
    steps:
      - uses: actions/checkout@v5
        if: env.DO_BUILD == 'true'
      - uses: actions/setup-python@v6
        if: env.DO_BUILD == 'true'
        with:
          python-version: "3.13"

      - name: Linux – systémové knihovny Qt
        if: env.DO_BUILD == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1 iputils-ping

      - name: Windows – Inno Setup
        if: env.DO_BUILD == 'true' && runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build (Windows)
        if: env.DO_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Build (Linux)
        if: env.DO_BUILD == 'true' && runner.os == 'Linux'
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./scripts/build_linux.sh --deb

      - name: Build (macOS)
        if: env.DO_BUILD == 'true' && runner.os == 'macOS'
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./scripts/build_macos.sh --dmg

      - name: Nahrát do release
        if: env.DO_BUILD == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*-setup.exe dist/*.tar.gz dist/*.deb dist/*.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "Žádné soubory k nahrání"; exit 1; }
          printf 'Nahrávám: %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
