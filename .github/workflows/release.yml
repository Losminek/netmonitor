# Sestavení a vydání NetMonitoru pro Windows, Linux a macOS (Intel i Apple Silicon).
# Spuštění:
#   a) vytvořením release / tagu "v*" na GitHubu
#   b) ručně: Actions → Build & Release → Run workflow → zadat existující tag (např. v1.0.1)
# Každý build nahraje své soubory PŘÍMO do release – nepoužívá Actions artefakty
# (ty mají u soukromých repozitářů omezenou kvótu úložiště; assety release se do ní nepočítají).
# Před buildem se na každé platformě spustí kompletní testy.
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existujícího release, do kterého se nahrají soubory (např. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04          # starší glibc => běží i na Debian 12 / Ubuntu 22.04+
            name: linux-x86_64
          - os: macos-latest          # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel        # Intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Linux – systémové knihovny Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1 iputils-ping

      - name: Windows – Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./scripts/build_linux.sh --deb

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./scripts/build_macos.sh --dmg

      - name: Nahrát do release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
